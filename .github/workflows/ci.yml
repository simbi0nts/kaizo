name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: seed builds the core, all suites
        run: |
          set -o pipefail
          make all 2>&1 | tee all.log
      - name: summary
        if: always()
        run: |
          { echo "### linux"; echo '```'; tail -c 30000 all.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: self-hosting fixpoint
        run: make selfhost
      - name: end-to-end (snake pty, hello-web http)
        run: make e2e
      - name: cross-build kaizo for every target
        run: |
          mkdir -p dist
          cp build/kaizo dist/kaizo-linux-x64
          build/kaizo build core -o dist/kaizo-windows-x64.exe --target windows-x64
          build/kaizo build core -o dist/kaizo-macos-x64 --target macos-x64
          build/kaizo build core -o dist/kaizo-macos-arm64 --target macos-arm64
          python3 tests/macho_check.py dist/kaizo-macos-x64 dist/kaizo-macos-arm64
          objdump -p dist/kaizo-windows-x64.exe | grep -E "DLL Name|Subsystem"
      - uses: actions/upload-artifact@v4
        with:
          name: kaizo-dist
          path: dist/

  native:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, bin: kaizo-windows-x64.exe }
          - { os: macos-latest, target: macos-arm64, bin: kaizo-macos-arm64 }
          - { os: macos-15-intel, target: macos-x64, bin: kaizo-macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: kaizo-dist
          path: dist
      - run: chmod +x dist/* || true
      - name: platform checks
        run: |
          set +e
          mkdir -p out
          tests/ci_platform.sh dist/${{ matrix.bin }} ${{ matrix.target }} dist 2>&1 | tee out/ci.log
          status=${PIPESTATUS[0]}
          # the job summary is readable without signing in (step logs are not)
          { echo "### ${{ matrix.target }}: exit $status"; echo '```'; tail -c 60000 out/ci.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # annotations are public even when logs are not: publish the end of the output
          msg=$(tail -c 8000 out/ci.log | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25"); gsub(/\r/,"%0D"); print}')
          if [ "$status" = 0 ]; then echo "::notice title=${{ matrix.target }} checks::$msg"; else echo "::error title=${{ matrix.target }} checks::$msg"; fi
          exit $status
